[workspace]
members = [
    "crates/margin-note",
    "crates/margin-projection",
    "crates/margin-vault",
    "crates/margin-vault-cli",
    "crates/margin-hub",
    "crates/margin-ui",
    "crates/margin-editor",
    "crates/margin",
    "crates/margin-web",
    "crates/osom",
    "crates/workspace-hack",
]
resolver = "3"

# The pure core: Markdown editing commands, the preview model and the topic
# and comment formats, with no I/O.
[package]
name = "margin-editor-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# `std::time` natively, the page's clock in a browser.
web-time = "1"

# Dependencies run optimized (layout, text shaping and Loro are slow at -O0)
# and carry line tables only: backtraces keep file and line, builds and links
# skip full debug info. Workspace crates keep full debug info. Every command
# (cargo run, a vault build, cargo test, scripts/test-editor) shares these
# builds and the workspace crates' builds: crates/workspace-hack pins the
# dependency features that would otherwise differ between them.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
strip = true

# `dx bundle --web --release` builds with this profile. wasm-bindgen needs the custom
# sections that `strip` removes; dx runs wasm-opt on its output instead.
[profile.wasm-release]
inherits = "release"
strip = false
