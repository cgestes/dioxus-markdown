[workspace]
members = [
    "crates/margin-note",
    "crates/margin-vault",
    "crates/margin-vault-cli",
    "crates/margin-hub",
    "crates/margin-ui",
    "crates/margin-editor",
    "crates/osom",
]
resolver = "3"

# The pure core: Markdown editing commands, the preview model and the topic
# and comment formats, with no I/O. The browser study builds it to wasm.
[package]
name = "margin-editor-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }

# Dependencies run optimized (layout, text shaping and Loro are slow at -O0)
# and carry line tables only: backtraces keep file and line, builds and links
# skip full debug info. Workspace crates keep full debug info. Every command
# (cargo run, cargo test, scripts/test-editor) shares this one build.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
strip = true
