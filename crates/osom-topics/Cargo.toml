[package]
name = "osom-topics"
version = "0.1.0"
edition = "2024"
publish = false

# Osom's model: the topics of the agent's space, its chats and reminders.
# It parses; osom-hub does the I/O.
[dependencies]
margin-core = { path = "../margin-core" }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
