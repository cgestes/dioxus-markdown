[package]
name = "margin-editor"
version = "0.1.0"
edition = "2024"
publish = false

# The Markdown editor: the notebook (Rich, Live and Source views, tables,
# comments, undo) that `margin` opens in a window, `margin-web` in a page, and
# Osom embeds. Native builds render with Blitz, browser builds with Dioxus Web.
[lib]
path = "src/lib.rs"

[dependencies]
margin-editor-core = { path = "../.." }
margin-note = { path = "../margin-note" }
margin-projection = { path = "../margin-projection" }
margin-ui = { path = "../margin-ui" }
anyhow = "1"
loro = { version = "1.18.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
web-time = "1"

# Native: Blitz renders the notebook.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus.git", rev = "0a7242a2a72b08975584bf8ecb05076a5ee0b9c7", default-features = false, features = ["prelude", "system-fonts", "woff", "svg", "accessibility", "clipboard", "hot-reload", "vello-hybrid"] }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
parley = { version = "=0.12.0", default-features = false }
webbrowser = "1.2"
# `margin_editor::testing` drives a rendered editor from another crate's tests.
blitz-traits = "=0.3.0-beta.4"

# Browser: the same notebook on Dioxus Web (the `margin-web` app).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus.git", rev = "0a7242a2a72b08975584bf8ecb05076a5ee0b9c7", features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
elsa = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "HtmlInputElement", "CssStyleDeclaration", "DomRect", "Range", "Node", "Navigator", "Location", "Event", "EventTarget", "FontFaceSet", "Blob", "BlobPropertyBag", "Url"] }

[target.'cfg(target_os = "macos")'.dependencies]
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus.git", rev = "0a7242a2a72b08975584bf8ecb05076a5ee0b9c7" }

[dev-dependencies]
tempfile = "3"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "=0.14.0"
anyrender_vello_cpu = { version = "=0.18.0", default-features = false }
png = "0.18"
