[package]
name = "margin-vault"
version = "0.1.0"
edition = "2024"
publish = false

# The encrypted personal vault: keys, local storage, the relay and sync.
[dependencies]
margin-note = { path = "../margin-note" }
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
crypto_secretstream = "0.2"
directories = "6"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hkdf = "0.12"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
loro = { version = "1.18.0", default-features = false }
loro-protocol = "0.3"
rand = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# Native TLS, the system trust store, as margin-hub uses for the agent.
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
url = "2"
zeroize = "1"
