[package]
name = "margin-web"
version = "0.1.0"
edition = "2024"
publish = false

# `margin-web`: the notebook in a browser page (Dioxus Web), installable as a
# web app. `dx serve --web --package margin-web`; `scripts/deploy-web` publishes it.
[[bin]]
name = "margin-web"
path = "src/main.rs"

[dependencies]
margin-editor = { path = "../margin-editor", default-features = false }
margin-ui = { path = "../margin-ui", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus.git", rev = "0a7242a2a72b08975584bf8ecb05076a5ee0b9c7", features = ["web"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
