[package]
name = "margin-web"
version = "0.1.0"
edition = "2024"
publish = false

# `margin-web`: the notebook in a browser page (Dioxus Web), installable as a
# web app. `dx serve --web --package margin-web`; `scripts/deploy-web` publishes it.
[[bin]]
name = "margin-web"
path = "src/main.rs"

[dependencies]
margin-editor = { path = "../margin-editor" }
margin-ui = { path = "../margin-ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
