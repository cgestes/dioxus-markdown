[package]
name = "margin-ui"
version = "0.1.0"
edition = "2024"
publish = false

# Margin's design system: tokens, components and the component gallery.
[lib]
path = "src/lib.rs"

[dependencies]
margin-editor-core = { path = "../.." }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# One set of features for the dependencies every build shares (see its Cargo.toml).
workspace-hack = { path = "../workspace-hack" }
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus.git", rev = "0a7242a2a72b08975584bf8ecb05076a5ee0b9c7", default-features = false, features = ["prelude", "system-fonts", "woff", "svg", "accessibility", "clipboard", "hot-reload", "vello-hybrid"] }
parley = { version = "=0.12.0", default-features = false }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }

# In a browser the same components render with Dioxus Web.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus.git", rev = "0a7242a2a72b08975584bf8ecb05076a5ee0b9c7", features = ["web"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics"] }
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blitz-traits = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "=0.14.0"
anyrender_vello_cpu = { version = "=0.18.0", default-features = false }
png = "0.18"
