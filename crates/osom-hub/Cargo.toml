[package]
name = "osom-hub"
version = "0.1.0"
edition = "2024"
publish = false

# Osom's network access: SilverBullet (the space) and ZeroClaw (the agent)
# over the tailnet (native-tls uses the system trust store), and the device
# token. It implements the core's agent and page-file interfaces.
[dependencies]
margin-editor-core = { path = "../.." }
osom-topics = { path = "../osom-topics" }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The transports: blocking HTTP and WebSocket.
tungstenite = { version = "0.29", features = ["native-tls"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
