[package]
name = "margin-note"
version = "0.1.0"
edition = "2024"
publish = false

# A note as a Loro document, and one kept in a local file.
[dependencies]
margin-core = { path = "../margin-core" }
loro = { version = "1.18.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
