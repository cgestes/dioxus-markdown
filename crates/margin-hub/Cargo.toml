[package]
name = "margin-hub"
version = "0.1.0"
edition = "2024"
publish = false

# The agent's side: SilverBullet and ZeroClaw over the tailnet (native-tls
# uses the system trust store), and the device token.
[dependencies]
margin-editor-core = { path = "../.." }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.29", features = ["native-tls"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
