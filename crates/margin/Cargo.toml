[package]
name = "margin"
version = "0.1.0"
edition = "2024"
publish = false

# `margin`: the notebook app around the Markdown editor (`margin-editor`):
# your personal notebook on the encrypted vault, a sync file, or the Field
# notes sample, and the design system's gallery (`margin ui`).
[[bin]]
name = "margin"
path = "src/main.rs"

[dependencies]
margin-editor = { path = "../margin-editor" }
margin-note = { path = "../margin-note" }
margin-ui = { path = "../margin-ui" }
clap = { version = "4", features = ["derive"] }
# The personal notebook only (the `vault` feature).
margin-vault = { path = "../margin-vault", optional = true }
anyhow = { version = "1", optional = true }
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
loro = { version = "1.18.0", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"], optional = true }

# The vault's file dialogs. rfd has no iOS backend; attachments stay desktop-only there for now.
[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }

[features]
default = []
# The personal notebook on the encrypted vault (SQLite, crypto, keychain, relay
# sync). Without it, `margin` opens the Field notes sample, and `--sync-file`
# still keeps a note in a local Loro file.
vault = ["dep:margin-vault", "dep:anyhow", "dep:futures-channel", "dep:futures-util", "dep:loro", "dep:rfd", "dep:serde_json", "dep:tokio"]

[dev-dependencies]
margin-editor = { path = "../margin-editor" }
anyhow = "1"
serde_json = "1"
tempfile = "3"
