[package]
name = "margin-vault-cli"
version = "0.1.0"
edition = "2024"
publish = false

# `margin-vault`: create, pair, back up and serve a vault from the terminal.
[[bin]]
name = "margin-vault"
path = "src/main.rs"

[dependencies]
margin-note = { path = "../margin-note" }
margin-vault = { path = "../margin-vault" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
loro = { version = "1.18.0", default-features = false }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
