[package]
name = "margin-core"
version = "0.1.0"
edition = "2024"
publish = false

# What every Margin crate shares, with no I/O and no interface: edits to
# Markdown source, the comment file and what an agent is asked about a
# comment, the interfaces to an agent and to versioned files, and dates.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# `std::time` natively, the page's clock in a browser.
web-time = "1"
